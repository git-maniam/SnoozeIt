name: CI Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"
  ACTIONS_STEP_DEBUG: "false"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore SnoozeIt.slnx

      - name: Build solution (Release)
        run: dotnet build SnoozeIt.slnx -c Release --no-restore

      - name: Publish Service and Client
        run: |
          dotnet publish SnoozeIt.Service/SnoozeIt.Service.csproj -c Release -r win-x64 -o publish/service --self-contained true
          dotnet publish SnoozeIt.Client/SnoozeIt.Client.csproj -c Release -r win-x64 -o publish/client --self-contained true

      - name: Run unit tests (if any)
        run: dotnet test SnoozeIt.slnx -c Release --no-build --logger "trx"

      - name: Install WiX Toolset (v4)
        run: choco install wixtoolset -y

      - name: Build MSI with WiX
        run: |
          heat dir publish/client -cg ClientComponents -dr INSTALLFOLDER -gg -scom -sreg -srd -var "var.ClientPublishDir" -o SnoozeIt.Installer/ClientComponents.wxs
          cd SnoozeIt.Installer
          candle -arch x64 -dClientPublishDir="..\publish\client" Product.wxs ClientComponents.wxs
          light Product.wixobj ClientComponents.wixobj -sval -o SnoozeItInstaller.msi

      - name: Sign MSI with self‑signed cert
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        shell: cmd
        run: |
          "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe" sign /f cert\SnoozeIt.pfx /p "%PFX_PASSWORD%" /tr http://timestamp.digicert.com /td sha256 /fd sha256 SnoozeIt.Installer\SnoozeItInstaller.msi

      - name: Upload signed MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnoozeIt-Installer
          path: SnoozeIt.Installer\SnoozeItInstaller.msi

