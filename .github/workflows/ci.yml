name: CI Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore SnoozeIt.slnx -r win-x64

      - name: Build solution (Release)
        run: dotnet build SnoozeIt.slnx -c Release -r win-x64 --no-restore

      - name: Run unit tests (if any)
        run: dotnet test SnoozeIt.slnx -c Release --no-build --logger "trx"

      - name: Install WiX Toolset (v4)
        run: choco install wixtoolset -y

      - name: Build MSI with WiX
        run: |
          cd SnoozeIt.Installer
          candle Product.wxs
          light Product.wixobj -o SnoozeItInstaller.msi

      - name: Sign MSI with self‑signed cert
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe" sign /f cert\SnoozeIt.pfx /p "$env:PFX_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 SnoozeIt.Installer\SnoozeItInstaller.msi

      - name: Upload signed MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnoozeIt-Installer
          path: SnoozeIt.Installer\SnoozeItInstaller.msi

